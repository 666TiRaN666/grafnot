<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafnot — визуальный пилот (этап 3)</title>
<!--
  Isolated pilot for stage 3 of the redesign prompt (docs/actual/Grafnot_Redesign_Prompt.md).
  Static mock: no app code, no storage, no network. Every state is in the URL query
  (?v=A|B|C&theme=&density=&lang=&screen=&panel=&tab=&sample=&w=&h=&nav=&mview=&status=&insert=&gplace=&bare=1)
  so screenshots and review links are reproducible.
  Owner's choice (29.10.2026): variant A «Лист»; the system is docs/actual/Stage3_Visual_System.md.
  B and C stay for comparison only.
-->
<style>
/* ---------- pilot chrome (not part of the proposal) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; background: #dfe3ea; color: #101828; }
#chrome { position: sticky; top: 0; z-index: 100; background: #ffffff; border-bottom: 1px solid #d0d5dd; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; }
#chrome .grp { display: flex; align-items: center; gap: 4px; }
#chrome .lbl { color: #475467; margin-right: 2px; }
#chrome button { font: inherit; border: 1px solid #d0d5dd; background: #fff; color: #101828; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
#chrome button[aria-pressed='true'] { background: #2447c4; border-color: #2447c4; color: #fff; }
#chrome input[type=number] { width: 70px; font: inherit; padding: 3px 6px; border: 1px solid #d0d5dd; border-radius: 6px; }
#readout { font-size: 12px; color: #344054; padding: 6px 12px; background: #f9fafb; border-bottom: 1px solid #e4e7ec; }
#readout b { color: #101828; }
#stage { padding: 16px; overflow: auto; }
body.bare #chrome, body.bare #readout { display: none; }
body.bare #stage { padding: 0; }
body.bare { background: #ffffff; }

/* ---------- proposal: tokens ---------- */
.app {
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s10: 40px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
  --nav-full: 224px; --nav-mini: 64px; --list-w: 300px; --panel-w: 320px;
  --measure: 640px; --ed-pad: 40px;
  --fs-ui: 14px; --fs-meta: 12.5px; --fs-body: 16px; --lh-body: 1.65; --fs-title: 26px; --fs-h2: 19px;
  --d1: 120ms; --d2: 180ms;
  font-family: var(--font); font-size: var(--fs-ui); line-height: 1.45; color: var(--text);
  position: relative; overflow: hidden; background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) { .app { --d1: 0ms; --d2: 0ms; } }
.app[data-theme='light'] {
  --text: #101828; --muted: #475467; --subtle: #5b6474;
  --accent: #2447c4; --accent-ink: #2447c4; --on-accent: #ffffff; --accent-soft: #eaf0fd; --sel: #e4ebfb;
  --surface: #ffffff; --tint: #f4f5f7; --tint-2: #f9fafb; --hover: #eef0f3;
  --line: #e4e7ec; --line-strong: #c4cad4; --control: #7f8796; --focus: #2447c4;
  --warn: #a2410a; --warn-soft: #fdf1e4; --ok: #12704f; --ok-soft: #e7f5ee; --danger: #a41d13;
  --shadow-pop: 0 10px 30px rgba(16,24,40,.16), 0 1px 3px rgba(16,24,40,.08);
  --shadow-row: 0 1px 2px rgba(16,24,40,.10), 0 0 0 1px rgba(16,24,40,.04);
  --scrim: rgba(16,24,40,.32);
}
.app[data-theme='dark'] {
  --text: #eceef2; --muted: #b6bdc9; --subtle: #a3abb8;
  --accent: #9dbcff; --accent-ink: #a9c4ff; --on-accent: #101828; --accent-soft: #1b2742; --sel: #20304f;
  --surface: #171b21; --tint: #0e1013; --tint-2: #13161b; --hover: #1f242c;
  --line: #262c35; --line-strong: #3d4552; --control: #7a8494; --focus: #9dbcff;
  --warn: #fdb022; --warn-soft: #2a2111; --ok: #4ad99a; --ok-soft: #0e241b; --danger: #ff9d94;
  --shadow-pop: 0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05);
  --shadow-row: 0 1px 2px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
  --scrim: rgba(0,0,0,.5);
}

/* ---------- variants: only surfaces and separation differ ---------- */
/* A «Лист»: one surface, hairline dividers, tinted selection */
.v-A { --canvas: var(--surface); --nav-bg: var(--surface); --list-bg: var(--surface); --ed-bg: var(--surface); --panel-bg: var(--surface); --row-sel: var(--sel); --row-sel-shadow: none; }
.v-A .nav, .v-A .list, .v-A .plan-main { border-right: 1px solid var(--line); }
.v-A .panel.pinned { border-left: 1px solid var(--line); }
/* B «Зоны»: tinted navigation/list/context, white editor sheet, raised selection */
.v-B { --canvas: var(--tint); --nav-bg: var(--tint); --list-bg: var(--tint); --ed-bg: var(--surface); --panel-bg: var(--tint-2); --row-sel: var(--surface); --row-sel-shadow: var(--shadow-row); }
.v-B .list, .v-B .plan-main { border-right: 1px solid var(--line); }
.v-B .ed-area, .v-B .plan-detail { border-left: 1px solid var(--line); }
.v-B .nav { border-right: 1px solid transparent; }
.v-B .panel.pinned { border-left: 1px solid var(--line); }
/* C «Один лист»: tinted shell, the editor is the only framed surface */
.v-C { --canvas: var(--tint); --nav-bg: var(--tint); --list-bg: var(--tint); --ed-bg: var(--surface); --panel-bg: var(--tint); --row-sel: var(--sel); --row-sel-shadow: none; }
.v-C .ed-area, .v-C .plan-detail, .v-C .week { margin: var(--s3) var(--s3) var(--s3) 0; border: 1px solid var(--line); border-radius: var(--r-lg); }
.v-C .ed-area.with-pinned { margin-right: 0; }
.v-C .panel.pinned { margin: var(--s3) var(--s3) var(--s3) 0; border-radius: 0 var(--r-lg) var(--r-lg) 0; border: 1px solid var(--line); border-left: none; background: var(--surface); }
.v-C .ed-area.with-pinned { border-radius: var(--r-lg) 0 0 var(--r-lg); }

/* ---------- shared components ---------- */
.app button { font: inherit; color: inherit; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.muted { color: var(--muted); }
.meta { font-size: var(--fs-meta); color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.quiet { border-color: transparent; background: transparent; }
.btn.quiet:hover { background: var(--hover); }
.btn.icon { width: 36px; justify-content: center; padding: 0; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn[aria-pressed='true'] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.btn .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.btn[aria-pressed='true'] .n { color: var(--accent-ink); }
.lnk { color: var(--accent-ink); text-decoration: none; cursor: pointer; border-radius: 4px; }
.lnk:hover { text-decoration: underline; }
.input { width: 100%; min-height: 34px; border: 1px solid var(--control); border-radius: var(--r-md); background: var(--surface); color: var(--text); padding: 0 10px; font: inherit; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.input .ph { color: var(--muted); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; line-height: 16px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 20px; padding: 0 7px; border-radius: 10px; background: var(--tint); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.v-B .chip, .v-C .chip { background: var(--hover); }
.chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.today { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.chip.src { background: transparent; padding: 0; color: var(--muted); }
.chip.src .ic { width: 14px; height: 14px; }
.derived { color: var(--subtle); font-style: italic; }
.cb { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--control); flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); margin-top: 1px; }
.cb.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cb.on .ic { width: 13px; height: 13px; stroke-width: 2.4; }

/* ---------- desktop shell ---------- */
.d { display: flex; height: 100%; }
.nav { width: var(--nav-full); flex: none; background: var(--nav-bg); display: flex; flex-direction: column; padding: var(--s3) var(--s2); gap: 2px; }
.nav.mini { width: var(--nav-mini); align-items: center; }
.nav .new { justify-content: flex-start; background: var(--accent-soft); color: var(--accent-ink); border: none; font-weight: 600; min-height: 36px; padding: 0 12px; margin-bottom: var(--s2); }
.nav .new:hover { background: var(--sel); }
.nav .item { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border-radius: var(--r-md); color: var(--muted); border: none; background: none; cursor: pointer; width: 100%; text-align: left; font-size: 13.5px; }
.nav .item:hover { background: var(--hover); color: var(--text); }
.nav .item.on { background: var(--row-sel); box-shadow: var(--row-sel-shadow); color: var(--text); font-weight: 600; }
.nav .item.on .ic { color: var(--accent-ink); }
.nav .item .badge { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .item .kbd { margin-left: auto; }
.nav.mini .item, .nav.mini .new { width: 44px; justify-content: center; padding: 0; }
.nav.mini .t, .nav.mini .badge, .nav.mini .kbd, .nav.mini .status .t { display: none; }
.nav .sp { flex: 1; }
.nav .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 6px 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.bad { background: var(--danger); }
.nav .collapse { margin-bottom: var(--s2); }

/* note list */
.list { width: var(--list-w); flex: none; background: var(--list-bg); display: flex; flex-direction: column; min-width: 0; }
.list .hd { padding: var(--s4) var(--s4) var(--s2); }
.list .hd h2 { margin: 0 0 var(--s3); font-size: 15px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; }
.list .rows { flex: 1; overflow: auto; padding: 0 var(--s2) var(--s2); }
.row { display: block; width: 100%; text-align: left; border: none; background: none; cursor: pointer; border-radius: var(--r-md); padding: 10px 10px; margin-bottom: 2px; color: var(--text); }
.row:hover { background: var(--hover); }
.row.on { background: var(--row-sel); box-shadow: var(--row-sel-shadow); }
.v-A .row.on { box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 var(--r-md) var(--r-md) 0; }
.row .ti { font-weight: 600; font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sn { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.row .mt { font-size: 12px; color: var(--muted); margin-top: 4px; display: block; }
.dense .row { padding: 6px 10px; }
.dense .row .sn { -webkit-line-clamp: 1; }
.dense .row .mt { display: none; }
.dense .row .ti { display: flex; gap: 8px; }
.dense .row .ti .dt { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); flex: none; }
.row .ti .dt { display: none; }
.dense .row .ti .dt { display: inline; }
.list .ft { padding: 6px var(--s4) 10px; font-size: 12px; color: var(--muted); }

/* editor */
.ed-area { flex: 1; min-width: 0; background: var(--ed-bg); position: relative; display: flex; flex-direction: column; overflow: hidden; }
.ed-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; min-height: 48px; }
.ed-bar .sp { flex: 1; }
.ed-scroll { flex: 1; overflow: auto; }
.ed { max-width: calc(var(--measure) + 2 * var(--ed-pad)); padding: 4px var(--ed-pad) 48px; margin: 0 auto; }
.ed h1 { font-size: var(--fs-title); line-height: 1.25; font-weight: 700; letter-spacing: -.015em; margin: 0 0 10px; overflow-wrap: anywhere; }
.ed h1.ph { color: var(--subtle); font-weight: 600; }
.ctx { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.ctx .links { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; font-size: 13.5px; }
.ctx .links .lab { color: var(--muted); }
.ctx .links .sep { color: var(--line-strong); }
.ctx .links .all { margin-left: auto; }
.ctx .ent { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.body { font-size: var(--fs-body); line-height: var(--lh-body); overflow-wrap: anywhere; }
.body p { margin: 0 0 12px; }
.body h2 { font-size: var(--fs-h2); line-height: 1.35; margin: 22px 0 8px; font-weight: 650; }
.body ul { margin: 0 0 12px; padding-left: 22px; }
.body li { margin: 3px 0; }
.body a { color: var(--accent-ink); }
.calcs { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 14px; }
.calcs .h { font-size: 13px; font-weight: 650; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; }
.calcs .h .btn { margin-left: auto; }
.calc { display: grid; grid-template-columns: minmax(120px, 200px) 1fr auto; gap: 12px; align-items: baseline; padding: 8px 10px; border-radius: var(--r-md); background: var(--tint-2); font-size: 14px; }
.v-B .calc, .v-C .calc { background: var(--tint); }
.calc .ex { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; color: var(--muted); overflow-wrap: break-word; }
.calc .rs { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* insert menu */
.menu { position: absolute; z-index: 30; min-width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 6px; }
.menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; min-height: 34px; padding: 0 10px; border-radius: var(--r-sm); cursor: pointer; font-size: 13.5px; }
.menu .mi:hover, .menu .mi.on { background: var(--hover); }
.menu .mi .k { margin-left: auto; color: var(--muted); font-size: 12px; }
.menu .sepl { height: 1px; background: var(--line); margin: 4px 6px; }

/* context panel */
.panel { width: var(--panel-w); flex: none; background: var(--panel-bg); display: flex; flex-direction: column; min-width: 0; }
.panel.temp { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; box-shadow: var(--shadow-pop); border-left: 1px solid var(--line); background: var(--surface); }
/* Tabs keep full labels: when they do not fit next to pin/close (KZ), the buttons wrap above them. */
.panel .ph { display: flex; flex-wrap: wrap-reverse; align-items: center; gap: 2px; padding: 8px 8px 0 12px; }
.panel .tabs { display: flex; gap: 2px; flex: 1 0 auto; }
.panel .ph .tabs + .btn { margin-left: auto; }
.panel .tab { border: none; background: none; cursor: pointer; padding: 0 10px; min-height: 32px; border-radius: var(--r-md); color: var(--muted); font-size: 13px; white-space: nowrap; }
.panel .tab:hover { background: var(--hover); color: var(--text); }
.panel .tab[aria-selected='true'] { color: var(--text); font-weight: 650; background: var(--row-sel); box-shadow: var(--row-sel-shadow); }
.panel .pb { flex: 1; overflow: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.sec h4 { margin: 0 0 6px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.li { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13.5px; }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .x { opacity: .75; }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; }
.gchip { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 12.5px; cursor: pointer; }
.gchip[aria-pressed='true'] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.pin-note { font-size: 12px; color: var(--muted); padding: 6px 16px 0; }

/* planner */
.plan-main { flex: 1; min-width: 0; background: var(--list-bg); display: flex; flex-direction: column; }
.v-A .plan-main { background: var(--surface); }
.plan-hd { padding: var(--s4) var(--s6) var(--s2); display: flex; flex-direction: column; gap: 10px; max-width: 820px; width: 100%; }
.plan-hd .top { display: flex; align-items: center; gap: 10px; }
.plan-hd h2 { margin: 0; font-size: 15px; font-weight: 650; }
.seg { display: inline-flex; background: var(--hover); border-radius: var(--r-md); padding: 2px; }
.seg button { border: none; background: none; min-height: 28px; padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed='true'] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-row); }
.plan-rows { flex: 1; overflow: auto; padding: 0 var(--s4) var(--s6); max-width: 820px; width: 100%; }
.grp-h { font-size: 12.5px; font-weight: 650; color: var(--muted); padding: 16px 8px 6px; display: flex; gap: 6px; }
.grp-h.warn { color: var(--warn); }
.trow { display: flex; gap: 10px; align-items: flex-start; padding: 9px 8px; border-radius: var(--r-md); cursor: pointer; }
.trow:hover { background: var(--hover); }
.trow.on { background: var(--row-sel); box-shadow: var(--row-sel-shadow); }
.trow .tx { flex: 1; min-width: 0; }
.trow .tt { font-size: 14px; overflow-wrap: anywhere; }
.trow .tm { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; align-items: center; }
.trow.done .tt { color: var(--muted); text-decoration: line-through; }
.dense .trow { padding: 5px 8px; }
.dense .trow .tx { display: flex; gap: 10px; align-items: baseline; }
.dense .trow .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dense .trow .tm { margin-top: 0; flex-wrap: nowrap; flex: 0 1 auto; min-width: 0; max-width: 50%; }
.chip.src { min-width: 0; flex: 0 1 auto; max-width: 280px; }
.chip .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dense .trow .tm .chip:not(.src) { flex: none; }
.composer { display: flex; gap: 8px; }
.plan-detail { width: 340px; flex: none; background: var(--ed-bg); display: flex; flex-direction: column; }
.plan-detail .in { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.plan-detail h3 { margin: 0; font-size: 18px; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
.fld .k { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.fld .v { font-size: 14px; }
.plan-detail .acts { display: flex; gap: 8px; margin-top: 6px; }

/* week */
.week-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--list-bg); }
.v-A .week-wrap { background: var(--surface); }
.week { flex: 1; min-width: 0; overflow: auto; background: var(--ed-bg); }
.wk-grid { display: grid; grid-template-columns: repeat(8, minmax(128px, 1fr)); min-height: 100%; }
.wk-col { border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.wk-col:last-child { border-right: none; }
.wk-col.today { background: var(--accent-soft); }
.wk-col .dh { font-size: 12px; color: var(--muted); }
.wk-col .dn { font-size: 18px; font-weight: 650; }
.wk-col.today .dn, .wk-col.today .dh { color: var(--accent-ink); }
.wk-card { font-size: 13px; padding: 6px 8px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-row); display: flex; gap: 6px; align-items: flex-start; overflow-wrap: break-word; hyphens: auto; min-width: 0; }
.wk-card > span:last-child { min-width: 0; }
.wk-card .cb { width: 16px; height: 16px; }
.wk-card.done > span:last-child { color: var(--muted); text-decoration: line-through; }
.wk-inbox { background: var(--tint-2); }
.v-A .wk-inbox { background: var(--surface); }

/* ---------- mobile ---------- */
.m { display: flex; flex-direction: column; height: 100%; background: var(--ed-bg); }
.v-A .m, .v-C .m { background: var(--surface); }
.m-hd { display: flex; align-items: center; gap: 4px; min-height: 52px; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.v-B .m-hd { background: var(--tint); }

const mobile = () => S.w < 768;
function layout() {
  const navW = S.nav === 'mini' ? 64 : 224, listW = 300, panelW = 320, pad = 80;
  const rest = S.w - navW - (S.screen === 'notes' ? listW : 0);
  const withPanel = rest - panelW;
  const canPin = withPanel - pad >= MIN_TEXT;
  const pinned = S.panel === 'pinned' && canPin;
  const temp = S.panel === 'temp' || (S.panel === 'pinned' && !canPin);
  const edW = pinned ? withPanel : rest;
  return { navW, listW, panelW, rest, edW, textW: Math.min(640, edW - pad), canPin, pinned, temp, withPanel };
}

  const f = document.getElementById('frame');
  f.className = 'app v-' + S.v + (S.density === 'dense' ? ' dense' : '');
  f.setAttribute('data-theme', S.theme);
  f.setAttribute('lang', S.lang === 'kz' ? 'kk' : 'ru');
  f.style.width = S.w + 'px';
  f.style.height = (mobile() ? Math.min(S.h, 844) : S.h) + 'px';
  f.innerHTML = mobile() ? mobileHtml() : desktopHtml();
  document.getElementById('chrome').innerHTML = chromeHtml();
  document.getElementById('readout').innerHTML = readoutHtml();
  const q = new URLSearchParams(); for (const k of Object.keys(S)) q.set(k, String(S[k]));
  if (document.body.classList.contains('bare')) q.set('bare', '1');
  history.replaceState(null, '', '?' + q.toString());
}
document.getElementById('chrome').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const k = b.dataset.k; S[k] = k === 'w' ? +b.dataset.v : b.dataset.v; render();
});
document.getElementById('chrome').addEventListener('change', (e) => { if (e.target.id === 'wIn') { S.w = Math.max(320, +e.target.value || 1440); render(); } });
render();
</script>
