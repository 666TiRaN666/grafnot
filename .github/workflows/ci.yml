# P5': CI gates (replaces P5). Ubuntu runner, UTC, runner fonts: audit and
# contrast numbers may differ from local runs (see non-blocking note below).
# Local mirror of the e2e job order: build -> preview -> e2e -> contrast ->
# audit -> stop preview. A real Actions run is not possible from dev machine.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run check:i18n
      - run: npm run check:i18n:selftest
      - run: node scripts/runner.selftest.cjs
      - run: node scripts/sync-readme.js --check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
      E2E_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start preview
        run: |
          node node_modules/vite/bin/vite.js preview --port 5199 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:5199/ && break
            sleep 1
          done
          curl -sf http://localhost:5199/
      - run: npm run e2e
      - run: npm run check:weight
      # станут блокирующими после первого зелёного прогона на Actions: числа зависят от шрифтов раннера
      - run: npm run check:contrast
        continue-on-error: true
      # станут блокирующими после первого зелёного прогона на Actions: числа зависят от шрифтов раннера
      - run: node scripts/audit-targets.cjs enforce
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-trace
          path: ${{ runner.temp }}/grafnot-e2e-artifacts
          if-no-files-found: warn
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/preview.pid) || true
